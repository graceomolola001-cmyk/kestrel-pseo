name: Install SEO Ops package

on:
  push:
    paths: ['seo_ops_bundle.b64', '.github/workflows/seo-ops-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Expand checked-in source package
        run: |
          python - <<'PY'
          import base64, lzma, json
          from pathlib import Path
          package = Path('seo_ops_bundle.b64')
          encoded = ''.join(Path('seo_ops_bundle.part' + str(i)).read_text() for i in range(1, 4)) + package.read_text()
          contents = json.loads(lzma.decompress(base64.b64decode(encoded)).decode('utf-8'))
          for name, body in contents.items():
              if not name.startswith('seo_ops/'):
                  continue
              path = Path(name)
              if '..' in path.parts or path.is_absolute() or not (
                  name.startswith('seo_ops/') or name in (
                      '.github/workflows/deploy.yml',
                      '.github/workflows/seo-ops-monitor.yml'
                  )
              ):
                  raise SystemExit('Unsafe package path: ' + name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(body, encoding='utf-8')
          package.unlink()
          for i in range(1, 4):
              Path('seo_ops_bundle.part' + str(i)).unlink()
          print('Installed', len(contents), 'source files')
          PY
          python -m unittest discover -s seo_ops/tests -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate SEO Ops control center and schema release QA"
          git push

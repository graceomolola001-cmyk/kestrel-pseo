name: Check, build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run SEO Ops tests
        run: python -m unittest discover -s seo_ops/tests -v

      - name: Check the dataset
        run: python pseo_checker.py data/pages.csv

      - name: Build the site
        env:
          KESTREL_GA4_MEASUREMENT_ID: ${{ vars.KESTREL_GA4_MEASUREMENT_ID }}
          KESTREL_GSC_VERIFICATION_TOKEN: ${{ vars.KESTREL_GSC_VERIFICATION_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO_LC" = "${OWNER}.github.io" ]; then
            BASE="https://${OWNER}.github.io"
          else
            BASE="https://${OWNER}.github.io/${REPO}"
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          python build.py --base-url "$BASE"

      - name: QA the built pages
        run: python qa.py dist

      - name: Automate schema and SEO release checks
        run: |
          python -m seo_ops.cli audit-dir dist \
            --base-url "$BASE" \
            --out dist/seo-health.json \
            --html dist/seo-health.html --strict
          python -m seo_ops.cli redirects seo_ops/redirects.csv --strict

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

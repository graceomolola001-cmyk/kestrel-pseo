name: Check, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the dataset
        run: python pseo_checker.py data/pages.csv

      - name: Build the site
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO_LC" = "${OWNER}.github.io" ]; then
            BASE="https://${OWNER}.github.io"
          else
            BASE="https://${OWNER}.github.io/${REPO}"
          fi
          echo "Base URL: $BASE"
          python build.py --base-url "$BASE"

      - name: QA the built pages
        run: python qa.py dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
